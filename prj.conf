# =========================
# PSRAM
# =========================
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_QUAD=y
CONFIG_SPIRAM_SPEED_40M=y
CONFIG_ESP_SPIRAM_MEMTEST=n
CONFIG_ESP_SPIRAM_HEAP_SIZE=65536

# =========================
# PRINTK via ROM UART (no inicializar driver UART de Zephyr)
# =========================
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n

# =========================
# LOG minimal: redirige LOG_* a printk() sin necesitar UART console
# =========================
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# =========================
# GPIO + SPI
# =========================
CONFIG_GPIO=y
CONFIG_SPI=y

# HWINFO: para derivar la DevEUI de la MAC del chip (hwinfo_get_device_id()).
CONFIG_HWINFO=y

# =========================
# UART (driver serial) para el ZE15-CO en UART1.
# La consola/printk NO depende de este driver (va por ROM UART/USB), pero
# CONFIG_UART_CONSOLE/CONSOLE siguen en n para no reasignar uart0.
# Se usa la API de polling (uart_poll_in/out), sin interrupciones.
# =========================
CONFIG_SERIAL=y

# =========================
# LORA + LORAWAN EU868
# =========================
CONFIG_LORA=y
CONFIG_LORA_SX126X=y
CONFIG_LORAWAN=y
CONFIG_LORAWAN_REGION_EU868=y

# =========================
# LORAWAN NVM: persiste el contexto MAC (DevNonce, claves de sesion) en flash.
# Sin esto el DevNonce se reinicia a 0 en cada arranque y el network server
# (anti-replay) descarta los Join-Request ya vistos -> "Rx 2 timeout" / -116.
# lorawan_start() llama internamente a settings_subsys_init() y restaura el
# contexto; usa la storage_partition por defecto del board (no requiere
# cambios en el flash layout).
# =========================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_LORAWAN_NVM_SETTINGS=y

# =========================
# STACK (LoRaWAN necesita mas que el default)
# =========================
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# =========================
# I2C + BM688 (sensor ambiental)
# CONFIG_I2C es auto-seleccionado por CONFIG_BME680 cuando el
# dispositivo esta en bus I2C, pero se declara explicitamente
# para claridad y compatibilidad.
# =========================
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME680=y

# =========================
# PORTAL CAUTIVO: WiFi SoftAP del ESP32-S3
# Modo AP-only: no necesitamos STA (LoRa no es WiFi), asi evitamos la
# coexistencia STA/AP (que exigiria una 2a instancia del nodo wifi en el
# devicetree -> NET_DEVICE_DT_INST_DEFINE(1)) y queda mas ligero.
# El heap de WiFi/NET se ubica en PSRAM para no asfixiar la SRAM interna.
# =========================
CONFIG_WIFI=y
CONFIG_WIFI_USAGE_MODE_AP=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
# NOTA crypto: se usa el crypto INTERNO del supplicant WPA (no mbedTLS). El
# AES interno del supplicant exporta aes_encrypt/aes_decrypt, igual que el
# soft-SE de loramac-node -> doble definicion al enlazar. En vez de arrastrar
# todo mbedTLS (EC/PK innecesarios para un AP WPA2-PSK), se renombran los dos
# simbolos AES de loramac (internos a esa lib) via CMakeLists. Ver CMakeLists.txt.

# =========================
# PORTAL CAUTIVO: stack de red + servidor DHCPv4
# NET_CONFIG_AUTO_INIT=n -> la IP del AP la fija portal.c manualmente.
# =========================
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
# IPv6 DESACTIVADO a proposito. CRITICO para el portal: con IPv6 activo y el
# servicio HTTP con host=NULL, el HTTP server enlaza en IPv6 (::) "por
# preferencia" (http_server_core.c) y los sockets IPv6 de Zephyr NO son
# dual-stack -> el movil IPv4 recibe RST ("ERR_CONNECTION_REFUSED"). Sin IPv6,
# enlaza 0.0.0.0:80. El portal solo usa IPv4 (DHCP/DNS/HTTP). Ademas libera RAM.
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_DHCPV4_SERVER=y
# CRITICO para el portal cautivo: el DHCP server anuncia 192.168.4.1 como
# servidor DNS (opcion 6). Sin esto, el sondeo de portal cautivo del movil
# (connectivitycheck/captive.apple/...) no tiene a quien resolver por WiFi ->
# el SO concluye "WiFi sin internet" (NO "portal cautivo") y enruta todo por
# datos moviles, por lo que la pagina no carga al conectarse. Con la opcion 6
# apuntando a nuestro responder DNS (captive_dns.c), el sondeo resuelve a
# 192.168.4.1, recibe el redirect 302 y el SO abre el portal SOLO, sin tener
# que apagar los datos del telefono.
CONFIG_NET_DHCPV4_SERVER_OPTION_DNS_ADDRESS="192.168.4.1"
# Pool DHCP: numero de IPs que reparte el AP (192.168.4.10 .. .19). Subido de 4
# (default) a 10 para no limitar el numero de dispositivos conectados a la vez.
# TOPE REAL: el SoftAP del ESP32-S3 admite como maximo 10 estaciones, y el driver
# de Zephyr trae .max_connection=5 HARDCODEADO (sin Kconfig) -> se parchea a 10 en
# zephyr/drivers/wifi/esp32/src/esp_wifi_drv.c. Ese parche vive en el arbol de
# Zephyr (NO en este repo); re-aplicar tras 'west update'. Ver docs/envio_sensores.md.
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=10
# CRITICO: cada socket consume un net_context y una conexion. Con los defaults
# (CONTEXTS=6, MAX_CONN=4) el servidor DHCPv4 + DNS:53 + sockets internos del
# WiFi agotan el pool y al HTTP server NO le queda para el socket de ESCUCHA ->
# bind/listen falla -> :80 cerrado (SELFTEST connect = -1 errno 111). Con
# holgura entran listener + clientes + DNS + DHCP.
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_MAX_CONN=16
CONFIG_NET_IF_MAX_IPV4_COUNT=2
# Buffers de red: subidos a 12 para dar holgura con mas estaciones/clientes
# concurrentes (antes 8, pensado para un solo movil). Si aparecen
# 'memory allocation failed' en coexistencia con LoRa, bajar de nuevo.
CONFIG_NET_PKT_RX_COUNT=12
CONFIG_NET_PKT_TX_COUNT=12

# =========================
# PORTAL CAUTIVO: servidor HTTP (dashboard + /api/sensors)
# MAX_CLIENTS=4: permite que varios moviles carguen el dashboard a la vez (cada
# uno abre pocas conexiones cortas: HTML + fetch + imagen). Debe ser >= el
# _concurrent del HTTP_SERVICE_DEFINE (=4). Mas clientes = mas RAM.
# =========================
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
# Presupuesto de descriptores y de poll(). CRITICO: con los defaults (tabla de
# fds = 8, poll = 3) el socket de escucha del HTTP server no consigue fd/poll
# y NO escucha -> el movil recibe RST ("conexion rechazada"). El servidor
# necesita: 1 socket de escucha + MAX_CLIENTS + el DNS:53 + sockets internos
# de red/WiFi/LoRa. Damos holgura (el sample http_server hace lo mismo).
CONFIG_ZVFS_OPEN_MAX=24
CONFIG_ZVFS_POLL_MAX=16
# CRITICO (causa del :80 cerrado): http_server_init() crea un eventfd y si
# falla ABORTA antes de bindear -> no hay listener. Con EVENTFD_MAX=1 el unico
# eventfd lo toma el net sockets service al arrancar y al HTTP server no le
# queda -> zvfs_eventfd() falla. Damos varios (server + sockets service + ...).
CONFIG_ZVFS_EVENTFD_MAX=4
# Log del HTTP server encendido para ver fallos de bind/listen si recurren.
CONFIG_NET_HTTP_SERVER_LOG_LEVEL_DBG=y
